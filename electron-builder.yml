appId: com.sevensave.ktoya
productName: Ktoya
copyright: © 2026 vldvr
directories:
  output: release
  buildResources: build
electronLanguages:
  - ru
  - en-US
files:
  - out/**
  - resources/**
  - package.json
win:
  icon: build/icon.png
  executableName: Ktoya
  # Имя для zip (nsis и portable задают свои ниже). Лаунчер ищет именно Ktoya-<версия>-win-x64.zip.
  artifactName: Ktoya-${version}-win-x64.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    # zip ставит лаунчер Sevensave: распаковывает в свою библиотеку и запускает без установщика.
    - target: zip
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  # «?» нельзя в имени файла Windows, поэтому ярлык без него.
  shortcutName: Кто я
  uninstallDisplayName: Кто я?
  deleteAppDataOnUninstall: false
  artifactName: Ktoya-Setup-${version}.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.family-games
  # Подписи Apple нет: подписываем ad-hoc, иначе на Apple Silicon macOS называет приложение повреждённым.
  identity: '-'
  hardenedRuntime: false
  # zip нужен для самообновления: приложение качает его и подменяет Ktoya.app (см. src/main/updater.ts).
  artifactName: Ktoya-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  title: Кто я?
portable:
  artifactName: Ktoya-${version}-portable.${ext}
publish:
  provider: github
  owner: sevensave
  repo: ktoya
  releaseType: draft
