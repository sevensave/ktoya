name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  windows:
    # Сборка под Windows на настоящем Windows: ловим поломки упаковки до релиза.
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --x64 --dir --publish never
      - run: if (!(Test-Path release/win-unpacked/Ktoya.exe)) { exit 1 }
        shell: pwsh

  light:
    needs: test
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, bundle: '--bundles app' }
          - { os: macos-15-intel, target: x86_64-apple-darwin, bundle: '--bundles app' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundle: '--no-bundle' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: rustup target add ${{ matrix.target }}
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run light:build -- --target ${{ matrix.target }} ${{ matrix.bundle }} -- --locked
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - run: bash tools/pack-light.sh ${{ matrix.target }}
