<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Caveat кладётся в src/renderer/src/assets/fonts; запасной путь — локальная копия в tools/.cache (не в git). */
  @font-face { font-family: 'Caveat'; src: url('../src/renderer/src/assets/fonts/Caveat.woff2') format('woff2'), url('.cache/caveat.woff2') format('woff2'); font-weight: 400 700; }
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  /* Иконка «Кто я?»: сливовая плитка, на ней жёлтый стикер с рукописным «?» и полоской скотча. */
  .icon { position: absolute; inset: 40px; border-radius: 230px; overflow: hidden;
    background: radial-gradient(120% 100% at 30% 20%, #28222f 0%, #1e1a24 45%, #16131a 100%);
    box-shadow: inset 0 0 0 4px rgba(243,236,223,.07); }
  .wrap { position: absolute; left: 172px; top: 182px; width: 600px; height: 600px; transform: rotate(-6deg);
    filter: drop-shadow(0 30px 34px rgba(0,0,0,.55)); }
  .sticker { position: absolute; inset: 0;
    background: linear-gradient(160deg, #ffe27a 0%, #ffd95a 55%, #f6cc45 100%);
    clip-path: polygon(0 0, 100% 0, 100% 80%, 80% 100%, 0 100%); }
  .curl { position: absolute; right: 0; bottom: 0; width: 120px; height: 120px;
    background: linear-gradient(135deg, #d9ad2a 0%, #f1d36c 48%, #fff0b0 100%);
    clip-path: polygon(0 0, 100% 0, 0 100%); }
  .q { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Caveat'; font-weight: 700;
    font-size: 620px; line-height: 1; color: #221a14; -webkit-text-stroke: 22px #221a14; padding: 0 70px 30px 0; transform: rotate(4deg); }
  .tape { position: absolute; left: 352px; top: 120px; width: 260px; height: 92px; transform: rotate(-10deg);
    background: rgba(250,240,220,.62); box-shadow: 0 4px 10px rgba(0,0,0,.18); }
</style>
</head>
<body><div class="icon">
  <div class="wrap"><div class="sticker"><div class="q">?</div><div class="curl"></div></div></div>
  <div class="tape"></div>
</div></body>
</html>
